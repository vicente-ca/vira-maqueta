[platformio]
src_dir = PulseraVira

[env]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@2.3.7

; ASCII L / R. Las dos variantes se construyen a partir del mismo código.
[env:izquierda]
build_flags = -DVIRA_SIDE=76

[env:derecha]
build_flags = -DVIRA_SIDE=82
